<script>
// ---------- 常量 ----------
const LOCATIONS = [];
['左','中','右'].forEach(s => { for (let i=1;i<=5;i++) LOCATIONS.push(s+i+'层'); });
const INBOUND_TYPES = ['采购入库','退货入库','调拨入库','归还入库','其他'];
const OUTBOUND_TYPES = ['领用出库','调拨出库','损耗出库','其他'];
let OB_TEACHERS = [];
async function ensureTeachers(){
  if (OB_TEACHERS.length) return OB_TEACHERS;
  try { const { data } = await sb.rpc('list_teachers'); OB_TEACHERS = data || []; } catch(e){}
  return OB_TEACHERS;
}
function myEmail(){ return (AUTH.user && AUTH.user.email) || ''; }
function teacherName(email){
  if(!email) return '';
  const t = OB_TEACHERS.find(x=>x.email===email);
  return t ? (t.real_name || t.email) : email;
}
const CATEGORIES = ['实训设备','工具耗材','电子元件','教材资料','其他'];
const UNITS = ['台','个','套','本','米','千克'];

// ---------- Supabase 配置（部署前由我填入真实值）----------
const SUPABASE_URL = 'https://mjucegnphdjpuxiyowrb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_wu__otFoGZ7rw581vmdFxA_IpYWaRI9';
const SHARE_KEY = 'yjjh2026'; // 教师只读分享口令，须与 view.html 一致
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- 存储（云端共享：Supabase）----------
const STATE = { materials: [], inbound: [], outbound: [], adjustments: [], users: [] };
let AUTH = { session: null, user: null, role: null, real_name: null };
const DB = {
  get(k, d) { if (k in STATE) return STATE[k]; return d; },
  set(k, v) { STATE[k] = v; }
};
function getMaterials(){ return STATE.materials; }
function getInbound(){ return STATE.inbound; }
function getOutbound(){ return STATE.outbound; }

async function loadSnapshot() {
  const [m, ib, ob, adj] = await Promise.all([
    sb.from('materials').select('*').order('id', { ascending: true }),
    sb.from('inbound').select('*').order('id', { ascending: false }),
    sb.from('outbound').select('*').order('id', { ascending: false }),
    sb.from('adjustments').select('*').order('id', { ascending: false }),
  ]);
  if (m.error) throw m.error;
  STATE.materials = m.data || [];
  STATE.inbound = ib.data || [];
  STATE.outbound = ob.data || [];
  STATE.adjustments = adj.data || [];
}
function today() { return new Date().toISOString().slice(0, 10); }
function now() { return new Date().toLocaleString('zh-CN'); }

// 数据由云端统一管理，不再本地初始化（initData 已弃用）


// ---------- 工具 ----------
let toastTimer = null;
function toast(msg, isErr){ const el=document.getElementById('toast'); el.textContent=msg; el.className='show'+(isErr?' err':''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className='', 2200); }
function showModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modalMask').classList.add('show'); }
function closeModal(){ document.getElementById('modalMask').classList.remove('show'); }
function statusOf(m){
  if (m.stock <= 0) return {cls:'danger', txt:'缺货'};
  if (m.stock < m.safety_stock) return {cls:'warn', txt:'库存预警'};
  return {cls:'ok', txt:'充足'};
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- 认证（Supabase Auth）----------
function isAdmin(){ return AUTH.role && ['校长','教务主任'].includes(AUTH.role); }
function isTeacher(){ return AUTH.role === '教师'; }
function canWriteTxn(){ return AUTH.role && ['校长','教务主任','教师'].includes(AUTH.role); }
function authName(){ return (AUTH.user && AUTH.user.user_metadata && AUTH.user.user_metadata.real_name) || (AUTH.user && AUTH.user.email) || '管理员'; }
async function checkLogin(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return false;
  return await afterAuth(session);
}
async function afterAuth(session){
  AUTH.session = session;
  AUTH.user = session.user;
  AUTH.role = (session.user.user_metadata && session.user.user_metadata.role) || null;
  AUTH.real_name = (session.user.user_metadata && session.user.user_metadata.real_name) || null;
  try { await loadSnapshot(); } catch(e){ toast('加载数据失败：' + (e.message || e), true); }
  askEntry();
  return true;
}
function askEntry(){
  // 带 ?view= 深链（如企微审批链接）直接进入系统，跳过选择
  const dv = new URLSearchParams(location.search).get('view');
  if (dv && ['materials','inbound','outbound','accounts','requests','purchase','transfer'].includes(dv)) { showApp(); return; }
  const who = esc(authName());
  showModal(`<h4>请选择进入方式</h4>
    <p class="hint" style="margin-left:0">当前登录账号：<b>${who}</b>。请选择进入「管理系统」或查看「物料看板」（只读看板）。</p>

      <button class="btn" onclick="closeModal(); showApp();">💼 进入管理系统</button>
      <button class="btn green" onclick="window.open('view.html?key=yjjh2026&from=login&v=20260816b','_blank'); closeModal();">📊 查看物料看板</button>
    </div>`);
}
async function doLogin(){
  let email = document.getElementById('lg_user').value.trim();
  const pwd = document.getElementById('lg_pwd').value;
  const err = document.getElementById('lg_err');
  err.textContent='';
  // 若输入不含 @，自动补全为 @yjjh.edu
  if (email && !email.includes('@')) email = email + '@yjjh.edu';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error){ err.textContent = error.message; return; }
  await afterAuth(data.session);
}
async function doLogout(){ if(!confirm('确认退出登录？退出后将返回登录界面。')) return; await sb.auth.signOut(); AUTH = { session:null, user:null, role:null, real_name:null }; location.reload(); }

// ---------- 修改自己的密码（所有登录用户，含教师）----------
function showMyPwd(){
  const email = (AUTH.user && AUTH.user.email) || '';
  showModal(`<h4>修改密码</h4>
    <p class="hint" style="margin-left:0">当前账号：<b>${esc(email)}</b>。为保障安全，需先验证当前密码；修改成功后将自动退出，请用新密码重新登录。</p>
    <div class="form-row"><label>当前密码</label><input id="mp_old" type="password" placeholder="请输入当前密码"></div>
    <div class="form-row"><label>新密码</label><input id="mp_new" type="password" placeholder="至少 6 位"></div>
    <div class="form-row"><label>确认新密码</label><input id="mp_new2" type="password" placeholder="再次输入新密码"></div>
    <div id="mp_msg" style="font-size:13px;color:#888;min-height:18px;margin-top:4px"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn green" id="mp_ok" onclick="doChangeMyPwd()">确认修改</button>
    </div>`);
  setTimeout(()=>{ const el=document.getElementById('mp_old'); if(el) el.focus(); }, 60);
}
async function doChangeMyPwd(){
  const oldp = document.getElementById('mp_old').value || '';
  const p1   = document.getElementById('mp_new').value || '';
  const p2   = document.getElementById('mp_new2').value || '';
  const msg  = document.getElementById('mp_msg');
  const btn  = document.getElementById('mp_ok');
  const fail = t => { msg.style.color='#e24b4a'; msg.textContent=t; btn.disabled=false; };
  if(!oldp) return fail('请输入当前密码');
  if(p1.length < 6) return fail('新密码至少 6 位');
  if(p1 !== p2) return fail('两次输入的新密码不一致');
  if(p1 === oldp) return fail('新密码不能与当前密码相同');
  const email = AUTH.user && AUTH.user.email;
  if(!email) return fail('登录状态异常，请重新登录后再试');
  btn.disabled = true; msg.style.color='#888'; msg.textContent='正在验证当前密码…';
  const { error: e1 } = await sb.auth.signInWithPassword({ email, password: oldp });
  if(e1) return fail('当前密码不正确，请重新输入');
  msg.textContent = '正在修改…';
  const { error: e2 } = await sb.auth.updateUser({ password: p1 });
  if(e2) return fail('修改失败：' + e2.message);
  closeModal();
  toast('密码已修改，即将退出，请用新密码重新登录');
  setTimeout(async ()=>{ try{ await sb.auth.signOut(); }catch(e){} location.reload(); }, 1800);
}

  document.getElementById('mi_outbound').style.display = isAdm ? 'block' : 'none';

  switchView('materials');
  // 深链支持：?view=requests / ?view=purchase 直接进入对应视图
  const dv = new URLSearchParams(location.search).get('view');
  if (dv && ['materials','inbound','outbound','accounts','requests','purchase','transfer'].includes(dv)) switchView(dv);
}

let CUR = 'materials';
function switchView(v){
  CUR = v;
  document.querySelectorAll('.menu-item').forEach(el=>el.classList.remove('active'));
  const cur = document.querySelector('.menu-item[data-view="'+v+'"]');
  if (cur) cur.classList.add('active');
  if (v==='materials') viewMaterials();
  else if (v==='inbound') viewInbound();
  else if (v==='outbound') viewOutbound();

function filterMaterials(){

    const s = statusOf(m); const hit2 = !st || s.cls===st;
    return hit && hit2;
  });
  document.getElementById('m_body').innerHTML = mats.map(m=>{
    const s = statusOf(m);
    const cons = m.is_consumable ? '<span class="tag danger">耗材</span>' : '<span class="tag">非耗材</span>';
    return `<tr><td>${m.code}</td><td>${m.name}</td><td>${m.spec||''}</td><td>${m.category}</td><td>${m.unit}</td><td>${m.location||''}</td><td style="background:#f5f9ff"><b style="font-size:16px;color:#1a1a1a">${m.stock}</b> <span style="color:#888;font-size:11px">${m.unit||''}</span></td><td style="color:#aaa;font-size:12px">≥ ${m.safety_stock}</td><td><span class="tag ${s.cls}">${s.txt}</span></td><td>${cons}</td>${isAdmin()?`<td><button class="btn sm" onclick="openAdjustModal(${m.id})">📝 调整</button> <button class="btn sm" onclick="openEditMat(${m.id})">✏️ 编辑</button></td>`:''}</tr>`;

let ADJ_MAT = null;
function getAdjustments(){ return STATE.adjustments; }
function saveAdjustments(a){ STATE.adjustments = a; }
function openAdjustModal(id){
  ADJ_MAT = id ? getMaterials().find(m=>m.id===id) : null;
  showModal(`<h4>📊 库存盘点 / 调整</h4>
    <p class="hint" style="margin-left:0">选择物料 → 录入盘点后的<b>实际数量</b> → 填写原因。系统将把库存更新为实盘数量，并保留一条调整记录（可追溯）。</p>
    <div class="form-row"><label>选择物料</label>
      <div class="mat-picker">
        <input id="adj_search" placeholder="🔍 搜索物料名称 / 编号" oninput="searchAdjMat()" autocomplete="off" value="${ADJ_MAT?ADJ_MAT.name:''}">
        <div class="results" id="adj_results"></div>
      </div>
    </div>
    <div id="adj_stockbox"></div>
    <div class="form-row"><label>实盘数量</label><input id="adj_new" type="number" min="0" placeholder="盘点后的实际库存数量" oninput="onAdjStock()"></div>
    <div class="form-row"><label>调整原因</label><input id="adj_reason" placeholder="如：盘点差异、损耗、报废、录入更正等" style="width:100%"></div>
    <div class="form-row"><label>经办人</label><input id="adj_handler" placeholder="经办人" style="width:120px" value="${AUTH.real_name||''}"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn blue" onclick="submitAdjustModal()">保存调整</button></div>`);
  if (ADJ_MAT) onAdjStock();
}
function searchAdjMat(){
  const q=(document.getElementById('adj_search').value||'').trim().toLowerCase();
  const box=document.getElementById('adj_results');
  if(!q){ box.style.display='none'; return; }
  const hits=getMaterials().filter(m=>m.name.toLowerCase().includes(q)||m.code.toLowerCase().includes(q)).slice(0,8);
  if(!hits.length){ box.innerHTML='<div class="empty">无匹配物料</div>'; box.style.display='block'; return; }
  box.innerHTML=hits.map(m=>`<div class="item" onclick="pickAdjMat(${m.id})"><span class="nm">${m.name}</span><span class="cd">${m.code}</span><span class="st">库存 ${m.stock}${m.unit}</span></div>`).join('');
  box.style.display='block';
}
function pickAdjMat(id){ ADJ_MAT=getMaterials().find(m=>m.id===id); document.getElementById('adj_search').value=ADJ_MAT.name; document.getElementById('adj_results').style.display='none'; onAdjStock(); }
function onAdjStock(){
  const box=document.getElementById('adj_stockbox');
  if(!ADJ_MAT){ box.innerHTML=''; return; }
  const nv=parseFloat(document.getElementById('adj_new').value);
  if(isNaN(nv)){ box.className='stock-box'; box.innerHTML=`当前系统库存：<b>${ADJ_MAT.stock}</b> ${ADJ_MAT.unit}（录入实盘数量后将显示差额）`; return; }
  const delta=nv-ADJ_MAT.stock;
  const sign=delta>0?('+'+delta):(delta<0?String(delta):'无变化');
  box.className='stock-box'+(delta<0?' warn':'');
  box.innerHTML=`当前系统库存：<b>${ADJ_MAT.stock}</b> ${ADJ_MAT.unit} ｜ 调整为：<b>${nv}</b> ｜ 差额：<b>${sign}</b>${delta<0?'（减少，请确认损耗/出库均已登记）':(delta>0?'（增加，请确认有对应入库）':'')}`;
}
async function submitAdjustModal(){
  if(!ADJ_MAT){ toast('请先搜索并选择物料', true); return; }
  const nv=parseFloat(document.getElementById('adj_new').value);
  if(isNaN(nv)||nv<0){ toast('请输入有效的实盘数量（≥0）', true); return; }
  const reason=document.getElementById('adj_reason').value.trim();
  if(!reason){ toast('请填写调整原因（便于追溯）', true); return; }
  const m=getMaterials().find(x=>x.id===ADJ_MAT.id);
  const old=m.stock; const delta=nv-old;
  try {
    const { error } = await sb.rpc('do_adjust', {
      p_material_id: ADJ_MAT.id, p_new_stock: nv, p_reason: reason,
      p_handler: document.getElementById('adj_handler').value.trim() || authName()
    });
    if (error) throw error;
    await loadSnapshot();
    toast(`已调整「${m.name}」库存为 ${nv}（${delta>0?'+':''}${delta}）`);
    closeModal(); viewMaterials();
  } catch(e){ toast(e.message, true); }
}
function viewAdjustLog(){
  const arr=getAdjustments().slice().reverse();
  const rows = arr.length ? arr.map(r=>`<tr><td>${r.date}</td><td>${r.material_code} ${r.material_name}</td><td>${r.old_stock} → <b>${r.new_stock}</b></td><td>${r.delta>0?'+':''}${r.delta}</td><td>${r.reason}</td><td>${r.handler||''}</td></tr>`).join('')
    : `<tr><td colspan="6" style="text-align:center;color:#999;padding:18px">暂无盘点调整记录</td></tr>`;
  showModal(`<h4>📋 库存盘点 / 调整记录</h4>
    <p class="hint" style="margin-left:0">所有库存盘点与人工调整都会留痕，便于追溯差异来源。</p>

}

function downloadInboundTemplate(){

    ['物料名称','规格型号','入库上架位置','入库类型','数量','经办人','备注'],

  ]);
  const loc = "'"+LOCATIONS.join(",")+"'";
  const typ = "'"+INBOUND_TYPES.join(",")+"'";
  ws['!dataValidations'] = { 'C3:C1000':{type:'list',allowBlank:true,formula1:loc}, 'D3:D1000':{type:'list',allowBlank:true,formula1:typ} };
  XLSX.utils.book_append_sheet(wb, ws, '入库批量导入');
  const ws2 = XLSX.utils.aoa_to_sheet([
    ['填写说明'],

    ['3. 入库类型请从下拉选择。'],
    ['4. 数量须大于 0。'],
    ['5. 日期由系统自动取导入当天，无需填写。'],
    ['6. 经办人留空默认当前登录人。'],
    ['7. 删除示例行后再导入。']
  ]);
  XLSX.utils.book_append_sheet(wb, ws2, '填写说明');
  XLSX.writeFile(wb, '入库批量导入模板.xlsx');
  toast('模板已下载');

async function doImportInbound(){
  const f = document.getElementById('imp_file').files[0];
  if (!f){ toast('请先选择文件', true); return; }
  const msg = document.getElementById('imp_msg');
  msg.textContent='导入中…';
  try {
    ensureXLSX();
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, blankrows:false, defval:null });
    let total=0, success=0; const errors=[];
    for (let i=1;i<rows.length;i++){
      const r=rows[i];
      if (!r || r.every(v=>v==null||v==='')) continue;
      total++;
      const name=(r[0]!=null?String(r[0]):'').trim();
      const qty=Number(r[4]);
      if(!name){ errors.push(`第${i+1}行：物料名称为空`); continue; }
      if(!(qty>0)){ errors.push(`第${i+1}行：数量无效`); continue; }
      try {
        const { error } = await sb.rpc('import_inbound_row', {
          p_name: name,
          p_spec: r[1]!=null?String(r[1]).trim():'',
          p_loc: (r[2]!=null?String(r[2]).trim():'') || '',
          p_type: (r[3]!=null?String(r[3]).trim():'') || '采购入库',
          p_qty: qty,
          p_handler: (r[5]!=null?String(r[5]).trim():'') || authName(),
          p_remark: r[6]!=null?String(r[6]).trim():'',
          p_date: today()
        });
        if (error) throw error;
        success++;
      } catch(e){ errors.push(`第${i+1}行：${e.message}`); }
    }
    await loadSnapshot();
    msg.innerHTML = `共 ${total} 行，成功 <b style="color:#1d9e75">${success}</b> 行，失败 <b style="color:#e24b4a">${errors.length}</b> 行。` + (errors.length?('<br>'+errors.slice(0,20).map(e=>'· '+e).join('<br>')):'');
    filterInbound();
  } catch(e){ msg.textContent='导入失败：'+e.message; }
}
function filterInbound(){
  const d=document.getElementById('if_date').value, m=document.getElementById('if_mat').value.trim(), h=document.getElementById('if_handler').value.trim();
  const recs = getInbound().filter(r=>{

}
function exportInbound(){

async function processOutbound(id){
  try {
    const { data: req, error: e1 } = await sb.from('outbound_requests').select('*').eq('id', id).maybeSingle();
    if (e1) throw new Error('查询申请失败：'+e1.message);
    if (!req){ toast('申请不存在', true); return; }
    // 预检库存
    const { data: mat } = await sb.from('materials').select('id,name,stock,unit,spec,is_consumable').eq('id', req.material_id).maybeSingle();
    if (!mat) throw new Error('关联物料「'+req.material_name+'」已在系统中删除，无法出库');
    const need = Number(req.qty)||0;
    const have = Number(mat.stock)||0;
    if (need > have) {
      const msg = '【库存不足】'+mat.name+' 当前库存 '+have+' '+mat.unit+'，申请数量 '+need+' '+mat.unit+'，无法出库。\n请先通过「入库管理」补充库存后再处理。';
      toast(msg, true); return;
    }
    // 耗材分流：耗材 = 损耗出库（不进教室库）；非耗材 = 领用出库 + 自动进申请老师教室物料库
    const isCons = !!mat.is_consumable;
    const obType = isCons ? '损耗出库' : (req.req_type || '领用出库');
    const toEmail = isCons ? null : (req.applicant_email || null);
    const flowTip = isCons
      ? '\n\n【耗材】按「损耗出库」处理，不计入教师教室物料库。'
      : ('\n\n【非耗材】按「'+obType+'」处理，出库后自动计入 '+(req.applicant_name||req.applicant_email||'申请老师')+' 的教室物料库。');
    if(!confirm('确认出库？\n\n物料：'+mat.name+'\n数量：'+need+' '+mat.unit+'\n当前库存：'+have+' '+mat.unit+'\n出库后剩余：'+(have-need)+' '+mat.unit+flowTip)) return;
    const { error: e2 } = await sb.rpc('do_outbound', {
      p_material_id: req.material_id,
      p_type: obType,
      p_qty: req.qty,
      p_date: today(),
      p_receiver: req.applicant_name || req.applicant_email || authName(),
      p_purpose: req.reason || null,
      p_remark: ('来自出库申请 #'+id+'：'+(req.reason||'')) || null,
      p_operator: AUTH.real_name || authName(),
      p_out_to_email: toEmail,
    });
    if (e2) throw new Error(e2.message || JSON.stringify(e2));
    if (!isCons && toEmail){
      const gi = await sb.rpc('grant_to_teacher', {
        p_to_email: toEmail,
        p_item_name: mat.name,
        p_model: mat.spec || '',
        p_unit: mat.unit || '',
        p_qty: Math.round(need),
        p_source: '出库申请审批 #' + id
      });
      if (gi.error) throw new Error('出库已完成，但计入教室物料库失败：'+gi.error.message);
    }
    const { error: e3 } = await sb.from('outbound_requests').update({ status:'handled', handled_at:new Date().toISOString(), handled_by: AUTH.real_name||'' }).eq('id', id);
    if (e3) throw new Error('更新状态失败：'+e3.message);
    toast('✅ 已出库 — '+mat.name+' 扣减 '+need+' '+mat.unit+'，剩余 '+(have-need)+' '+mat.unit + (isCons?'（耗材·损耗出库）':'（已计入'+(req.applicant_name||'申请老师')+'教室物料库）'));
    await loadRequests();
    await loadSnapshot();
  } catch(e){ toast('❌ 出库失败：'+e.message, true); }
}

// 在物料库中查找与申请物品同名/近似的物料
function matchStockItems(name){
  const norm = s => (s||'').toString().toLowerCase().replace(/[\s\-_/（）()【】\[\]]/g,'');
  const key = norm(name);
  if (key.length < 2) return [];
  return (getMaterials()||[]).filter(m=>{
    const mn = norm(m.name);
    if (!mn) return false;
    return mn === key || mn.includes(key) || key.includes(mn);
  });
}

// 实时提示：申请的物品在库里是否已有货
function onPurchaseNameInput(){
  const box = document.getElementById('pu_stockbox'); if(!box) return;

  const hits = matchStockItems(name);
  if (!hits.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='block';
  const enough = hits.filter(m => Number(m.stock||0) > Number(m.safety_stock||0));
  box.className = 'stock-box' + (enough.length ? ' ok' : '');
  box.innerHTML = '<b>📦 库房已有相近物料：</b><br>' + hits.map(m=>{
    const s = Number(m.stock||0), ss = Number(m.safety_stock||0);
    const tip = s>ss ? '<span style="color:#1a7f37">库存充足</span>'
              : (s<=0 ? '<span style="color:#e24b4a">缺货</span>' : '<span style="color:#c47f17">低于安全线</span>');
    return `· ${esc(m.name)}${m.spec?' ['+esc(m.spec)+']':''} — 现有 <b>${s}</b> ${esc(m.unit||'')}（安全线 ≥${ss}）｜ ${tip}`;
  }).join('<br>');
}

async function submitPurchase(){
  const name  = (document.getElementById('pu_name').value||'').trim();
  const qty   = parseFloat(document.getElementById('pu_qty').value);
  if(!name){ alert('请填写物品名称'); return; }
  if(!qty || qty<=0){ alert('请输入有效的采购数量'); return; }
  const model  = (document.getElementById('pu_model').value||'').trim()  || null;
  const unit   = (document.getElementById('pu_unit').value||'').trim()   || null;
  const date   = document.getElementById('pu_date').value || null;
  const priceV = parseFloat(document.getElementById('pu_price').value);
  const price  = isNaN(priceV) ? null : priceV;
  let url      = (document.getElementById('pu_url').value||'').trim() || null;
  if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  const reason = (document.getElementById('pu_reason').value||'').trim() || null;
  const remark = (document.getElementById('pu_remark').value||'').trim() || null;

  // 库存充足提醒：库里已有同名物料且库存高于安全库存线，先请教师确认
  const enough = matchStockItems(name).filter(m => Number(m.stock||0) > Number(m.safety_stock||0));
  if (enough.length){
    const detail = enough.map(m =>
      `　• ${m.name}${m.spec?'（'+m.spec+'）':''}：现有 ${Number(m.stock||0)} ${m.unit||''}（安全库存线 ≥${Number(m.safety_stock||0)}）`
    ).join('\n');
    const ok = confirm(
      '📦 库房已有该物料，且库存充足\n\n' + detail +
      '\n\n本次申请采购：' + name + ' × ' + qty + ' ' + (unit||'') +
      '\n\n如果只是课堂领用，请改用「出库申请」直接领取，无需采购。\n\n确认仍要提交这条采购申请吗？'
    );
    if (!ok) return;
  }

  try {
    const { error } = await sb.from('purchase_requests').insert({
      item_name:name, model, qty, unit, expect_date:date, est_price:price,
      buy_url:url, reason, remark
    });
    if (error) throw error;

    const content = '## 🛒 采购申请知会（无需审批）\n'
      + '> **申请人**：' + esc(AUTH.real_name || AUTH.email || '未知') + '\n'
      + '> **物品名称**：' + esc(name) + '\n'
      + '> **型号规格**：' + esc(model || '—') + '\n'
      + '> **数量**：' + qty + ' ' + esc(unit || '') + '\n'
      + '> **期望到货**：' + (date || '—') + '\n'
      + (price!=null ? '> **预估单价**：¥' + price + '（合计约 ¥' + (price*qty).toFixed(2) + '）\n' : '')
      + '> **用途**：' + esc(reason || '（未填写）') + '\n'
      + (enough.length ? '> **⚠️ 库房现有**：' + enough.map(m=>esc(m.name)+' '+Number(m.stock||0)+esc(m.unit||'')+'（安全线≥'+Number(m.safety_stock||0)+'）').join('；') + '\n' : '')

async function setPurchaseStatus(id, status){

function exportPurchase(){
  ensureXLSX();
  const fs = (document.getElementById('pr_filter')||{}).value || '';
  const q  = ((document.getElementById('pr_search')||{}).value || '').trim().toLowerCase();
  let rows = PR_CACHE.filter(r => !fs || (fs==='rejected' ? isRejected(r) : !isRejected(r)));
  if (q) rows = rows.filter(r => [r.item_name,r.model,r.applicant_name,r.reason].some(v=>(v||'').toLowerCase().includes(q)));
  // 全部状态下若混有已驳回条目，询问是否剔除（发给行政采购通常只要有效申请）
  if (!fs){
    const bad = rows.filter(isRejected).length;
    if (bad) {
      rows = confirm('当前结果含 ' + bad + ' 条「已驳回」申请。\n\n发给行政采购通常不含驳回项。\n\n点「确定」= 只导出有效申请\n点「取消」= 全部导出')
        ? rows.filter(r=>!isRejected(r)) : rows;
    }
  }
  if(!rows.length){ toast('当前筛选结果为空，无可导出内容', true); return; }

  let total = 0;
  const recs = rows.map((r,i)=>{
    const sub = (r.est_price!=null) ? Number(r.est_price)*Number(r.qty) : null;
    if (sub!=null) total += sub;
    return [ i+1, r.item_name||'', r.model||'', Number(r.qty)||0, r.unit||'',
             r.est_price!=null?Number(r.est_price):'', sub!=null?Number(sub.toFixed(2)):'',
             r.expect_date||'', r.buy_url||'', r.reason||'',
             r.applicant_name||r.applicant_email||'',
             (r.created_at||'').replace('T',' ').slice(0,16),
             (PR_STATUS[r.status]||{label:r.status}).label, r.remark||'' ];
  });
  recs.push(['','合计','','','','', Number(total.toFixed(2)), '','','','','','','']);

  const ws = XLSX.utils.aoa_to_sheet([
    ['序号','物品名称','型号/规格','数量','单位','预估单价(元)','预估小计(元)','期望到货','购买链接','用途说明','申请人','提交时间','状态','备注'],
    ...recs
  ]);
  ws['!cols'] = [{wch:5},{wch:20},{wch:18},{wch:7},{wch:6},{wch:12},{wch:13},{wch:12},{wch:34},{wch:22},{wch:10},{wch:17},{wch:9},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '采购计划');
  XLSX.writeFile(wb, '采购计划_' + today() + '.xlsx');
  toast('已导出 ' + rows.length + ' 条采购申请');
}

// —— 归还入库：判断某条教室物料能否退回仓库（与后端 return_to_warehouse 匹配规则一致）——
function normKey(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,''); }
function matchWarehouse(itemName, model){
  const mats = getMaterials() || [];
  const n = normKey(itemName), md = normKey(model);
  const same = mats.filter(m => normKey(m.name) === n);
  if (!same.length) return null;
  const exact = same.find(m => normKey(m.spec) === md);
  if (exact) return exact;
  return same.length === 1 ? same[0] : { _ambiguous: true, name: itemName };
}
function returnState(r){
  const m = matchWarehouse(r.item_name, r.model);
  if (!m) return { ok:false, label:'仓库未建档', color:'#999', reason:'物料仓库中没有同名物料，无法归还（请联系教务主任建档）' };
  if (m._ambiguous) return { ok:false, label:'型号不明确', color:'#e8710a', reason:'仓库中有多条同名物料，请先核对规格型号' };
  if (m.is_consumable) return { ok:false, label:'耗材·不可归还', color:'#d93025', reason:'耗材用完即消耗，不支持归还入库' };
  return { ok:true, label:'非耗材·可归还', color:'#0b8043', reason:'', mat:m };
}

// —— 来源列格式化：邮箱→人名，出库申请审批→物料仓库 ——
function formatSource(src, holderEmail){
  if (!src) return '—';
  const s = String(src).trim();
  // 出库申请审批 #XX → 📦 物料仓库
  if (/^出库申请审批\s*#?\d*/.test(s)) return '📦 物料仓库';
  // 流转自 xxx@yyy → 尝试从缓存取人名
  const m = s.match(/^流转自\s+(.+)$/);
  if (m) {
    const email = m[1].trim();
    // 如果看起来像邮箱，尝试从 TI_CACHE 查人名
    if (email.includes('@')) {
      const found = TI_CACHE.find(r => r.holder_email === email);
      if (found && found.holder_name) return '🔄 流转自 ' + found.holder_name;
    }
    return '🔄 ' + s;  // 已经是人名或无法识别
  }
  return s;
}

      const { error: e2 } = await sb.from('teacher_inventory').update({ qty: Number(ex.qty)+qty, updated_at:new Date().toISOString() }).eq('id', ex.id);
      if (e2) throw e2;
    } else {
      const { error: e3 } = await sb.from('teacher_inventory').insert({
        holder_email: me, holder_name: AUTH.real_name||'', item_name: name, model, unit, qty, source

// 批量流转给其他老师
async function openTransferModal(){

    </div>`).join('');

    <div style="margin:8px 0 4px;font-size:13px;color:#555">勾选的物料及流转数量：</div>
    ${rows}

    <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn blue" onclick="submitTransfer(${items.length})">确认流转</button></div>`);
}
async function submitTransfer(n){
  const to = document.getElementById('tf_to').value;
  if(!to){ toast('请选择接收老师', true); return; }
  const items = [];
  for(let i=0;i<n;i++){
    const qty = parseInt(document.getElementById('tf_qty_'+i).value,10);
    const name = document.getElementById('tf_name_'+i).value;
    const model = document.getElementById('tf_model_'+i).value;
    const unit = document.getElementById('tf_unit_'+i).value;
    const from = document.getElementById('tf_from_'+i).value;
    if(!qty || qty<=0){ toast('「'+name+'」流转数量需大于 0', true); return; }
    items.push({ item_name:name, model, unit, qty, holder_email:from });
  }
  // 教务主任代转时，要求所选物料同属一位老师
  const fromEmail = isAdmin() ? items[0].holder_email : AUTH.user.email;
  if (isAdmin() && items.some(r=>r.holder_email !== fromEmail)){
    toast('请只选择同一位老师的物料进行流转', true); return;
  }
  const msg = document.getElementById('tf_msg'); msg.textContent='流转中…';
  try {
    const { error } = await sb.rpc('do_transfer', { p_from_email: fromEmail, p_to_email: to, p_items: items });
    if (error) throw error;
    const tName = (TI_VIEW_TEACHERS.find(t=>t.email===to)||{}).real_name || to;
    const detail = items.map(r=>`${r.item_name}${r.model?'['+r.model+']':''} × ${r.qty} ${r.unit||''}`).join('；');
    const content = '## 🔄 物料流转知会\n'
      + '> **转出**：' + esc(AUTH.real_name || AUTH.user.email) + '\n'
      + '> **接收**：' + esc(tName) + '\n'
      + '> **物料**：' + detail + '\n'
      + '> **时间**：' + new Date().toLocaleString('zh-CN');
    await pushWecom(content);
    closeModal();
    toast('✅ 已流转给 ' + tName);
    await loadTransfer();
  } catch(e){ msg.innerHTML='<span style="color:#e24b4a">流转失败：'+esc(e.message)+'</span>'; }
}

// 📥 归还入库：把非耗材从教室物料库退回学校物料仓库（自动生成入库记录）
function openReturnModal(oneId){
  let items;
  if (oneId){
    items = TI_CACHE.filter(r=>r.id===oneId);
  } else {
    const ids = new Set([...document.querySelectorAll('.ti_chk:checked')].map(c=>c.value));
    items = TI_CACHE.filter(r=>ids.has(r.id));
  }
  const okItems = [], badItems = [];
  items.forEach(r=>{ const s = returnState(r); (s.ok?okItems:badItems).push({ row:r, state:s }); });
  if (!okItems.length){
    toast(badItems.length ? ('无可归还物料：'+badItems[0].state.reason) : '请先勾选要归还的物料', true);
    return;
  }
  // 教务主任代办时要求同属一位老师
  const fromEmail = isAdmin() ? okItems[0].row.holder_email : AUTH.user.email;
  if (okItems.some(x=>x.row.holder_email !== fromEmail)){
    toast('请只选择同一位老师的物料进行归还', true); return;
  }
  const rows = okItems.map((x,i)=>{
    const r = x.row;
    return `<div class="form-row" style="align-items:center">
      <label style="width:auto;min-width:170px">${esc(r.item_name)}${r.model?' ['+esc(r.model)+']':''}</label>
      <input type="number" min="1" max="${r.qty}" value="${r.qty}" id="rt_qty_${i}" style="width:90px"> <span style="color:#888">/ 共 ${r.qty} ${esc(r.unit||'')}</span>
      <span style="color:#0b8043;font-size:12px;margin-left:6px">→ 仓库「${esc(x.state.mat.name)}」现有 ${x.state.mat.stock} ${esc(x.state.mat.unit||'')}</span>
      <input type="hidden" id="rt_name_${i}" value="${esc(r.item_name)}">
      <input type="hidden" id="rt_model_${i}" value="${esc(r.model||'')}">
      <input type="hidden" id="rt_unit_${i}" value="${esc(r.unit||'')}">
    </div>`;
  }).join('');
  const skipped = badItems.length
    ? `<div style="margin-top:8px;padding:8px 10px;background:#fff4e5;border-left:3px solid #e8710a;font-size:12px;color:#8a4b00">
        以下 ${badItems.length} 项无法归还，已自动跳过：<br>${badItems.map(x=>'· '+esc(x.row.item_name)+'（'+x.state.reason+'）').join('<br>')}
       </div>` : '';
  showModal(`<h4>📥 归还入库 · 退回学校物料仓库</h4>
    <p class="hint" style="margin-left:0">确认后物料将从<b>教室物料库扣减</b>，并在仓库生成一笔<b>「归还入库」</b>记录、库存自动增加。仅<b>非耗材</b>可归还。</p>
    <div style="margin:8px 0 4px;font-size:13px;color:#555">归还物料及数量：</div>
    ${rows}
    <div class="form-row"><label>归还说明</label><input id="rt_remark" placeholder="如：课程结束退回 / 设备闲置退库" value="课程结束退回"></div>
    ${skipped}
    <input type="hidden" id="rt_from" value="${esc(fromEmail)}">
    <div id="rt_msg" style="font-size:13px;color:#888;min-height:16px;margin-top:6px"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn green" onclick="submitReturn(${okItems.length})">确认归还入库</button></div>`);
}
async function submitReturn(n){
  const fromEmail = document.getElementById('rt_from').value;
  const remark = (document.getElementById('rt_remark').value||'').trim();
  const items = [];
  for (let i=0;i<n;i++){
    const qty = parseInt(document.getElementById('rt_qty_'+i).value,10);
    const name = document.getElementById('rt_name_'+i).value;
    const model = document.getElementById('rt_model_'+i).value;
    const unit = document.getElementById('rt_unit_'+i).value;
    if(!qty || qty<=0){ toast('「'+name+'」归还数量需大于 0', true); return; }
    items.push({ item_name:name, model, unit, qty });
  }
  const msg = document.getElementById('rt_msg'); msg.textContent='归还入库中…';
  try {
    const { data, error } = await sb.rpc('return_to_warehouse', {
      p_from_email: fromEmail, p_items: items, p_remark: remark || null
    });
    if (error) throw error;
    const res = data || {};
    const content = '## 📥 物料归还入库\n'
      + '> **归还人**：' + (res.handler || authName()) + '\n'
      + '> **物料**：' + (res.detail || items.map(r=>r.item_name+' × '+r.qty).join('；')) + '\n'
      + '> **说明**：' + (remark || '教师归还') + '\n'
      + '> **时间**：' + new Date().toLocaleString('zh-CN');
    await pushWecom(content);
    closeModal();
    toast('✅ 已归还入库 — 共 '+(res.items||items.length)+' 种、'+(res.qty||0)+' 件，仓库库存已增加');
    await loadSnapshot();
    await loadTransfer();
  } catch(e){ msg.innerHTML='<span style="color:#e24b4a">归还失败：'+esc(e.message||e)+'</span>'; }
}

// 调整 / 删除本人（或教务主任代管）教室物料
async function deleteItem(id){

    toast('已删除');
    await loadTransfer();

async function adjustItem(id){
  const row = TI_CACHE.find(r=>r.id===id);
  const v = prompt('调整「'+(row?row.item_name:'')+'」的数量为：', row?row.qty:0);
  if(v===null) return;
  const qty = parseInt(v,10);
  if(isNaN(qty)||qty<0){ toast('数量无效', true); return; }
  try {
    const { error } = await sb.from('teacher_inventory').update({ qty, updated_at:new Date().toISOString() }).eq('id', id);
    if (error) throw error;
    toast('已更新数量');
    await loadTransfer();
  } catch(e){ toast('更新失败：'+e.message, true); }
}

// ---------- 账户管理（教务主任专用）----------
const EDGE_CREATE_TEACHER = 'https://mjucegnphdjpuxiyowrb.supabase.co/functions/v1/create-teacher';
const EDGE_WECOM_PROXY = 'https://mjucegnphdjpuxiyowrb.supabase.co/functions/v1/wecom-proxy';

async function viewAccounts(){
  let html = `<h3>账户管理（教务主任专用）</h3>
    <div class="hint" style="background:#e8f5e9;border:1px solid #a5d6a7;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;line-height:1.6">
      <b>✅ 可直接在系统内新建教师账号</b>：填英文账号（如 wang）、初始密码、姓名、角色，点「创建账号」即可，系统自动生成邮箱（wang@yjjh.edu），老师立刻能登录。
    </div>
    <div class="panel">
      <h4>新建 / 设置账号</h4>
      <div class="toolbar">
        <input id="au_email" placeholder="登录账号（如 wang，自动生成 wang@yjjh.edu）" style="width:220px">
        <input id="au_pwd" type="text" placeholder="初始密码" style="width:140px" value="123456">
        <input id="au_name" placeholder="姓名（如 王老师）" style="width:150px">
        <select id="au_role"><option value="教师">教师（可入库/出库）</option><option value="教务主任">教务主任（含账户管理）</option></select>
        <button class="btn green" onclick="createAccount()">创建账号</button>
      </div>
      <div id="au_msg" style="font-size:13px;color:#888;margin-top:6px"></div>
    </div>
    <h4 style="margin:14px 0 10px;font-size:15px">已有账号</h4>
    <table><thead><tr><th>邮箱</th><th>姓名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="au_body"></tbody></table>`;
  document.getElementById('mainView').innerHTML = html;
  await loadAccounts();
}
async function loadAccounts(){
  try {
    const { data, error } = await sb.rpc('admin_list_users');
    if (error) throw error;
    const rows = (data||[]).map(u=>`<tr>
      <td>${esc(u.email)}</td><td>${esc(u.real_name||'')}</td><td>${esc(u.role||'')}</td>
      <td>${u.confirmed?'<span class="tag ok">已激活</span>':'<span class="tag warn">待激活</span>'}</td>
      <td>${u.email==='jiaowu@yjjh.edu'?'<span style="color:#999">主账号</span>':'<button class="btn sm blue" onclick="resetPwd(\''+esc(u.email)+'\')">重置密码</button> <button class="btn sm red" onclick="deleteAccount(\''+esc(u.email)+'\')">删除</button>'}</td>
    </tr>`).join('');
    document.getElementById('au_body').innerHTML = rows || '<tr><td colspan="5" style="text-align:center;color:#999;padding:18px">暂无账号</td></tr>';
  } catch(e){ document.getElementById('au_body').innerHTML = '<tr><td colspan="5" style="color:#e24b4a">加载失败：'+esc(e.message)+'</td></tr>'; }
}
async function createAccount(){
  let email=document.getElementById('au_email').value.trim();
  const pwd=document.getElementById('au_pwd').value;
  const name=document.getElementById('au_name').value.trim();
  const role=document.getElementById('au_role').value;
  const msg=document.getElementById('au_msg');
  if(!email||!pwd){ msg.innerHTML='<span style="color:#e24b4a">请填写账号与初始密码</span>'; return; }
  // 若输入不含 @，自动补全为 @yjjh.edu
  if (!email.includes('@')) email = email + '@yjjh.edu';
  // 校验只允许英文、数字、下划线、点、连字符
  if (!/^[a-zA-Z0-9._+-]+@yjjh\.edu$/.test(email)){
    msg.innerHTML='<span style="color:#e24b4a">账号只能包含英文字母、数字、下划线、点、连字符</span>'; return;
  }
  msg.textContent='创建中…';
  try {
    const { data: sess } = await sb.auth.getSession();
    const token = sess?.session?.access_token;
    if(!token){ msg.innerHTML='<span style="color:#e24b4a">登录态失效，请刷新页面重新登录</span>'; return; }
    const res = await fetch(EDGE_CREATE_TEACHER, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ action:'create', email, password:pwd, role, real_name:name })
    });
    const out = await res.json();
    if(!res.ok){ msg.innerHTML = '<span style="color:#e24b4a">失败：'+esc(out.error||res.status)+'</span>'; return; }
    msg.innerHTML = '<span style="color:#2e7d32">✅ ' + esc(out.msg||'创建成功') + '</span>';
    document.getElementById('au_email').value=''; document.getElementById('au_pwd').value=''; document.getElementById('au_name').value='';
    await loadAccounts();
  } catch(e){ msg.innerHTML = '<span style="color:#e24b4a">失败：'+esc(e.message)+'</span>'; }
}
async function deleteAccount(email){
  if(!confirm('确认删除账号 '+email+'？该老师将无法再登录。')) return;
  try {
    const { data: sess } = await sb.auth.getSession();
    const token = sess?.session?.access_token;
    if(!token){ toast('登录态失效，请刷新页面', true); return; }
    const res = await fetch(EDGE_CREATE_TEACHER, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ action:'delete', email })
    });
    const out = await res.json();
    if(!res.ok){ toast('删除失败：'+(out.error||res.status+' '+JSON.stringify(out)), true); return; }
    toast(out.msg||'已删除');
    await loadAccounts();
  } catch(e){ toast('删除请求异常：'+e.message, true); }
}

// 重置某个教师账号的密码（教务主任专用，走 Edge Function 的 reset_password）
function genRandomPwd(){
  const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  let s=''; for(let i=0;i<10;i++) s += cs[Math.floor(Math.random()*cs.length)];
  return s;
}
function resetPwd(email){
  showModal(`<h4>重置密码 · ${esc(email)}</h4>
    <p class="hint" style="margin-left:0">为该老师设置新密码，可直接使用下方随机生成的强密码，也可自行修改。重置后请转告老师用新密码登录。</p>
    <div class="form-row"><label>新密码</label><input id="rp_pwd" value="${genRandomPwd()}" style="flex:1"></div>
    <div id="rp_msg" style="font-size:13px;color:#888;margin-top:4px"></div>
    <div class="modal-actions">
      <button class="btn" onclick="document.getElementById('rp_pwd').value=genRandomPwd()">🎲 换一个</button>
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn green" onclick="doResetPwd('${esc(email)}')">确认重置</button>
    </div>`);
}
async function doResetPwd(email){
  const pwd = (document.getElementById('rp_pwd').value||'').trim();
  if(!pwd || pwd.length < 6){ document.getElementById('rp_msg').innerHTML='<span style="color:#e24b4a">密码至少 6 位</span>'; return; }
  const msg = document.getElementById('rp_msg');
  msg.textContent='重置中…';
  try {
    const { data: sess } = await sb.auth.getSession();
    const token = sess?.session?.access_token;
    if(!token){ msg.innerHTML='<span style="color:#e24b4a">登录态失效，请刷新页面重新登录</span>'; return; }
    const res = await fetch(EDGE_CREATE_TEACHER, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ action:'reset_password', email, password: pwd })
    });
    const out = await res.json();
    if(!res.ok){ msg.innerHTML='<span style="color:#e24b4a">失败：'+esc(out.error||res.status)+'</span>'; return; }
    msg.innerHTML='<span style="color:#2e7d32">✅ '+esc(out.msg||'密码已重置')+'<br>新密码：<b>'+esc(pwd)+'</b></span>';
  } catch(e){ msg.innerHTML='<span style="color:#e24b4a">失败：'+esc(e.message)+'</span>'; }
}
