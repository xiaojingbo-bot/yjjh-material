<script>
// ---------- 常量 ----------
const LOCATIONS = [];
['左','中','右'].forEach(s => { for (let i=1;i<=5;i++) LOCATIONS.push(s+i+'层'); });
const INBOUND_TYPES = ['采购入库','退货入库','调拨入库','其他'];
const OUTBOUND_TYPES = ['领用出库','调拨出库','损耗出库','其他'];
const CATEGORIES = ['实训设备','工具耗材','电子元件','教材资料','其他'];
const UNITS = ['台','个','套','本','米','千克'];

// ---------- Supabase 配置（部署前由我填入真实值）----------
const SUPABASE_URL = 'https://mjucegnphdjpuxiyowrb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_wu__otFoGZ7rw581vmdFxA_IpYWaRI9';
const SHARE_KEY = 'yjjh2026'; // 教师只读分享口令，须与 view.html 一致
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- 存储（云端共享：Supabase）----------
const STATE = { materials: [], inbound: [], outbound: [], adjustments: [], users: [] };
let AUTH = { session: null, user: null, role: null, real_name: null };
const DB = {
  get(k, d) { if (k in STATE) return STATE[k]; return d; },
  set(k, v) { STATE[k] = v; }
};
function getMaterials(){ return STATE.materials; }
function getInbound(){ return STATE.inbound; }
function getOutbound(){ return STATE.outbound; }

async function loadSnapshot() {
  const [m, ib, ob, adj] = await Promise.all([
    sb.from('materials').select('*').order('id', { ascending: true }),
    sb.from('inbound').select('*').order('id', { ascending: false }),
    sb.from('outbound').select('*').order('id', { ascending: false }),
    sb.from('adjustments').select('*').order('id', { ascending: false }),
  ]);
  if (m.error) throw m.error;
  STATE.materials = m.data || [];
  STATE.inbound = ib.data || [];
  STATE.outbound = ob.data || [];
  STATE.adjustments = adj.data || [];
}
function today() { return new Date().toISOString().slice(0, 10); }
function now() { return new Date().toLocaleString('zh-CN'); }

// 数据由云端统一管理，不再本地初始化（initData 已弃用）


// ---------- 工具 ----------
let toastTimer = null;
function toast(msg, isErr){ const el=document.getElementById('toast'); el.textContent=msg; el.className='show'+(isErr?' err':''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className='', 2200); }
function showModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modalMask').classList.add('show'); }
function closeModal(){ document.getElementById('modalMask').classList.remove('show'); }
function statusOf(m){
  if (m.stock <= 0) return {cls:'danger', txt:'缺货'};
  if (m.stock < m.safety_stock) return {cls:'warn', txt:'库存预警'};
  return {cls:'ok', txt:'充足'};
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- 认证（Supabase Auth）----------
function isAdmin(){ return AUTH.role && ['校长','教务主任'].includes(AUTH.role); }
function isTeacher(){ return AUTH.role === '教师'; }
function canWriteTxn(){ return AUTH.role && ['校长','教务主任','教师'].includes(AUTH.role); }
function authName(){ return (AUTH.user && AUTH.user.user_metadata && AUTH.user.user_metadata.real_name) || (AUTH.user && AUTH.user.email) || '管理员'; }
async function checkLogin(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return false;
  return await afterAuth(session);
}
async function afterAuth(session){
  AUTH.session = session;
  AUTH.user = session.user;
  AUTH.role = (session.user.user_metadata && session.user.user_metadata.role) || null;
  AUTH.real_name = (session.user.user_metadata && session.user.user_metadata.real_name) || null;
  try { await loadSnapshot(); } catch(e){ toast('加载数据失败：' + (e.message || e), true); }
  showApp();
  return true;
}
async function doLogin(){
  let email = document.getElementById('lg_user').value.trim();
  const pwd = document.getElementById('lg_pwd').value;
  const err = document.getElementById('lg_err');
  err.textContent='';
  // 若输入不含 @，自动补全为 @yjjh.edu
  if (email && !email.includes('@')) email = email + '@yjjh.edu';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error){ err.textContent = error.message; return; }
  await afterAuth(data.session);
}
async function doLogout(){ if(!confirm('确认退出登录？退出后将返回登录界面。')) return; await sb.auth.signOut(); AUTH = { session:null, user:null, role:null, real_name:null }; location.reload(); }

// ---------- 修改自己的密码（所有登录用户，含教师）----------
function showMyPwd(){
  const email = (AUTH.user && AUTH.user.email) || '';
  showModal(`<h4>修改密码</h4>
    <p class="hint" style="margin-left:0">当前账号：<b>${esc(email)}</b>。为保障安全，需先验证当前密码；修改成功后将自动退出，请用新密码重新登录。</p>
    <div class="form-row"><label>当前密码</label><input id="mp_old" type="password" placeholder="请输入当前密码"></div>
    <div class="form-row"><label>新密码</label><input id="mp_new" type="password" placeholder="至少 6 位"></div>
    <div class="form-row"><label>确认新密码</label><input id="mp_new2" type="password" placeholder="再次输入新密码"></div>
    <div id="mp_msg" style="font-size:13px;color:#888;min-height:18px;margin-top:4px"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn green" id="mp_ok" onclick="doChangeMyPwd()">确认修改</button>
    </div>`);
  setTimeout(()=>{ const el=document.getElementById('mp_old'); if(el) el.focus(); }, 60);
}
async function doChangeMyPwd(){
  const oldp = document.getElementById('mp_old').value || '';
  const p1   = document.getElementById('mp_new').value || '';
  const p2   = document.getElementById('mp_new2').value || '';
  const msg  = document.getElementById('mp_msg');
  const btn  = document.getElementById('mp_ok');
  const fail = t => { msg.style.color='#e24b4a'; msg.textContent=t; btn.disabled=false; };
  if(!oldp) return fail('请输入当前密码');
  if(p1.length < 6) return fail('新密码至少 6 位');
  if(p1 !== p2) return fail('两次输入的新密码不一致');
  if(p1 === oldp) return fail('新密码不能与当前密码相同');
  const email = AUTH.user && AUTH.user.email;
  if(!email) return fail('登录状态异常，请重新登录后再试');
  btn.disabled = true; msg.style.color='#888'; msg.textContent='正在验证当前密码…';
  const { error: e1 } = await sb.auth.signInWithPassword({ email, password: oldp });
  if(e1) return fail('当前密码不正确，请重新输入');
  msg.textContent = '正在修改…';
  const { error: e2 } = await sb.auth.updateUser({ password: p1 });
  if(e2) return fail('修改失败：' + e2.message);
  closeModal();
  toast('密码已修改，即将退出，请用新密码重新登录');
  setTimeout(async ()=>{ try{ await sb.auth.signOut(); }catch(e){} location.reload(); }, 1800);
}
function showApp(){
  document.getElementById('sideUser').textContent = authName() + '（' + (AUTH.role || '未设角色') + '）';
  document.getElementById('loginView').style.display='none';
  document.getElementById('appView').style.display='flex';
  document.getElementById('backupPanel').style.display = isAdmin() ? 'block' : 'none';
  document.getElementById('mi_accounts').style.display = isAdmin() ? 'block' : 'none';
  document.getElementById('mi_requests').style.display = canWriteTxn() ? 'block' : 'none';
  document.getElementById('mi_purchase').style.display = canWriteTxn() ? 'block' : 'none';
  document.getElementById('mi_outbound').style.display = isAdmin() ? 'block' : 'none';
  document.getElementById('mi_inbound').style.display = isAdmin() ? 'block' : 'none';
  switchView('materials');
  // 深链支持：?view=requests / ?view=purchase 直接进入对应视图
  const dv = new URLSearchParams(location.search).get('view');
  if (dv && ['materials','inbound','outbound','accounts','requests','purchase'].includes(dv)) switchView(dv);
}

// ---------- 视图切换 ----------
let CUR = 'materials';
function switchView(v){
  CUR = v;
  document.querySelectorAll('.menu-item').forEach(el=>el.classList.remove('active'));
  const cur = document.querySelector('.menu-item[data-view="'+v+'"]');
  if (cur) cur.classList.add('active');
  if (v==='materials') viewMaterials();
  else if (v==='inbound') viewInbound();
  else if (v==='outbound') viewOutbound();
  else if (v==='accounts') viewAccounts();
  else if (v==='requests') viewRequests();
  else if (v==='purchase') viewPurchase();
}

// ---------- 物料管理（只读台账）----------
function viewMaterials(){
  const mats = getMaterials();
  const warns = mats.filter(m => (m.stock||0) <= 0 || (m.stock||0) < (m.safety_stock||0)).length;
  const totalStock = mats.reduce((s,m)=>s+(Number(m.stock)||0),0);
  let html = `<h3>物料管理 · 库存台账（只读）</h3>
    <p class="hint">本页为物料状态总览，仅查看不可编辑；新增物料请在「入库管理」中登记或批量导入。</p>
    <div class="cards">
      <div class="card"><div class="n">${mats.length}</div><div class="l">物料种类</div></div>
      <div class="card"><div class="n">${totalStock}</div><div class="l">库存总量（件）</div></div>
      <div class="card"><div class="n" style="color:${warns?'#e24b4a':'#1d9e75'}">${warns}</div><div class="l">预警物料数</div></div>
    </div>
    <div class="toolbar">
      <input id="m_search" placeholder="🔍 搜索名称 / 编号 / 型号" oninput="filterMaterials()" style="width:240px">
      <select id="m_status" onchange="filterMaterials()">
        <option value="">全部状态</option><option value="ok">充足</option><option value="warn">库存预警</option><option value="danger">缺货</option>
      </select>
      <button class="btn" onclick="refreshMaterials()" id="m_refresh_btn">↻ 刷新</button>
      ${isAdmin()?'<button class="btn" style="margin-left:auto" onclick="openAdjustModal()">📊 库存盘点 / 调整</button><button class="btn blue" onclick="viewAdjustLog()">📋 盘点记录</button>':''}
    </div>
    <table><thead><tr><th>编号</th><th>名称</th><th>规格型号</th><th>类别</th><th>单位</th><th>上架位置</th><th style="background:#eef4ff;color:#2f6fed">当前库存</th><th style="color:#999;font-weight:400">安全库存线</th><th>状态</th>${isAdmin()?'<th>操作</th>':''}</tr></thead><tbody id="m_body"></tbody></table>`;
  document.getElementById('mainView').innerHTML = html;
  filterMaterials();
}
async function refreshMaterials(){
  const btn = document.getElementById('m_refresh_btn');
  const old = btn?.innerHTML;
  if (btn){ btn.disabled = true; btn.innerHTML = '⟳ 刷新中…'; }
  try {
    await loadSnapshot();
    viewMaterials();
    toast('已刷新物料数据');
  } catch(e){ toast('刷新失败：' + (e.message || e), true); }
  finally { if (btn){ btn.disabled = false; btn.innerHTML = old; } }
}
function filterMaterials(){
  const q = (document.getElementById('m_search').value||'').trim().toLowerCase();
  const st = document.getElementById('m_status').value;
  const mats = getMaterials().filter(m=>{
    const hit = !q || m.name.toLowerCase().includes(q) || m.code.toLowerCase().includes(q) || (m.spec||'').toLowerCase().includes(q);
    const s = statusOf(m); const hit2 = !st || s.cls===st;
    return hit && hit2;
  });
  document.getElementById('m_body').innerHTML = mats.map(m=>{
    const s = statusOf(m);

function searchAdjMat(){
  const q=(document.getElementById('adj_search').value||'').trim().toLowerCase();

  if(!q){ box.style.display='none'; return; }
  const hits=getMaterials().filter(m=>m.name.toLowerCase().includes(q)||m.code.toLowerCase().includes(q)).slice(0,8);

  box.innerHTML=hits.map(m=>`<div class="item" onclick="pickAdjMat(${m.id})"><span class="nm">${m.name}</span><span class="cd">${m.code}</span><span class="st">库存 ${m.stock}${m.unit}</span></div>`).join('');

function pickAdjMat(id){ ADJ_MAT=getMaterials().find(m=>m.id===id); document.getElementById('adj_search').value=ADJ_MAT.name; document.getElementById('adj_results').style.display='none'; onAdjStock(); }
function onAdjStock(){
  const box=document.getElementById('adj_stockbox');
  if(!ADJ_MAT){ box.innerHTML=''; return; }
  const nv=parseFloat(document.getElementById('adj_new').value);
  if(isNaN(nv)){ box.className='stock-box'; box.innerHTML=`当前系统库存：<b>${ADJ_MAT.stock}</b> ${ADJ_MAT.unit}（录入实盘数量后将显示差额）`; return; }
  const delta=nv-ADJ_MAT.stock;
  const sign=delta>0?('+'+delta):(delta<0?String(delta):'无变化');
  box.className='stock-box'+(delta<0?' warn':'');
  box.innerHTML=`当前系统库存：<b>${ADJ_MAT.stock}</b> ${ADJ_MAT.unit} ｜ 调整为：<b>${nv}</b> ｜ 差额：<b>${sign}</b>${delta<0?'（减少，请确认损耗/出库均已登记）':(delta>0?'（增加，请确认有对应入库）':'')}`;

async function submitAdjustModal(){
  if(!ADJ_MAT){ toast('请先搜索并选择物料', true); return; }
  const nv=parseFloat(document.getElementById('adj_new').value);
  if(isNaN(nv)||nv<0){ toast('请输入有效的实盘数量（≥0）', true); return; }
  const reason=document.getElementById('adj_reason').value.trim();
  if(!reason){ toast('请填写调整原因（便于追溯）', true); return; }
  const m=getMaterials().find(x=>x.id===ADJ_MAT.id);
  const old=m.stock; const delta=nv-old;
  try {
    const { error } = await sb.rpc('do_adjust', {
      p_material_id: ADJ_MAT.id, p_new_stock: nv, p_reason: reason,
      p_handler: document.getElementById('adj_handler').value.trim() || authName()
    });
    if (error) throw error;
    await loadSnapshot();
    toast(`已调整「${m.name}」库存为 ${nv}（${delta>0?'+':''}${delta}）`);
    closeModal(); viewMaterials();
  } catch(e){ toast(e.message, true); }
}

function downloadInboundTemplate(){
  ensureXLSX();
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([
    ['物料名称','规格型号','入库上架位置','入库类型','数量','经办人','备注'],
    ['示例伺服驱动器','SDR-220V','左1层','采购入库',10,'张三','示例行请删除'],

  ]);
  const loc = "'"+LOCATIONS.join(",")+"'";
  const typ = "'"+INBOUND_TYPES.join(",")+"'";
  ws['!dataValidations'] = { 'C3:C1000':{type:'list',allowBlank:true,formula1:loc}, 'D3:D1000':{type:'list',allowBlank:true,formula1:typ} };
  XLSX.utils.book_append_sheet(wb, ws, '入库批量导入');
  const ws2 = XLSX.utils.aoa_to_sheet([
    ['填写说明'],

    ['4. 数量须大于 0。'],
    ['5. 日期由系统自动取导入当天，无需填写。'],
    ['6. 经办人留空默认当前登录人。'],
    ['7. 删除示例行后再导入。']
  ]);
  XLSX.utils.book_append_sheet(wb, ws2, '填写说明');
  XLSX.writeFile(wb, '入库批量导入模板.xlsx');
  toast('模板已下载');
}
async function doImportInbound(){
  const f = document.getElementById('imp_file').files[0];
  if (!f){ toast('请先选择文件', true); return; }
  const msg = document.getElementById('imp_msg');
  msg.textContent='导入中…';
  try {
    ensureXLSX();
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, blankrows:false, defval:null });
    let total=0, success=0; const errors=[];
    for (let i=1;i<rows.length;i++){
      const r=rows[i];
      if (!r || r.every(v=>v==null||v==='')) continue;
      total++;
      const name=(r[0]!=null?String(r[0]):'').trim();
      const qty=Number(r[4]);
      if(!name){ errors.push(`第${i+1}行：物料名称为空`); continue; }
      if(!(qty>0)){ errors.push(`第${i+1}行：数量无效`); continue; }
      try {
        const { error } = await sb.rpc('import_inbound_row', {
          p_name: name,
          p_spec: r[1]!=null?String(r[1]).trim():'',
          p_loc: (r[2]!=null?String(r[2]).trim():'') || '',
          p_type: (r[3]!=null?String(r[3]).trim():'') || '采购入库',
          p_qty: qty,
          p_handler: (r[5]!=null?String(r[5]).trim():'') || authName(),
          p_remark: r[6]!=null?String(r[6]).trim():'',
          p_date: today()
        });
        if (error) throw error;
        success++;
      } catch(e){ errors.push(`第${i+1}行：${e.message}`); }
    }
    await loadSnapshot();
    msg.innerHTML = `共 ${total} 行，成功 <b style="color:#1d9e75">${success}</b> 行，失败 <b style="color:#e24b4a">${errors.length}</b> 行。` + (errors.length?('<br>'+errors.slice(0,20).map(e=>'· '+e).join('<br>')):'');
    filterInbound();
  } catch(e){ msg.textContent='导入失败：'+e.message; }
}
function filterInbound(){
  const d=document.getElementById('if_date').value, m=document.getElementById('if_mat').value.trim(), h=document.getElementById('if_handler').value.trim();
  const recs = getInbound().filter(r=>{
    const mat = getMaterials().find(x=>x.id===r.material_id)||{};
    return (!d||r.date===d) && (!m||(mat.name||'').includes(m)) && (!h||(r.handler||'').includes(h));
  }).map(r=>{ const mat=getMaterials().find(x=>x.id===r.material_id)||{}; return {...r, material_code:mat.code||'', material_name:mat.name||'', material_spec:mat.spec||'', material_location:mat.location||''}; });
  document.getElementById('ib_body').innerHTML = recs.map(r=>`<tr><td>${r.id}</td><td>${r.material_code}</td><td>${r.material_name}</td><td>${r.material_spec}</td><td>${r.material_location}</td><td>${r.type}</td><td><b>+${r.qty}</b></td><td>${r.date}</td><td>${r.handler}</td><td>${r.remark||''}</td></tr>`).join('') || `<tr><td colspan="10" style="text-align:center;color:#999;padding:20px">暂无入库记录</td></tr>`;
}
function exportInbound(){
  ensureXLSX();
  const d=document.getElementById('if_date').value, m=document.getElementById('if_mat').value.trim(), h=document.getElementById('if_handler').value.trim();
  const recs = getInbound().filter(r=>{ const mat=getMaterials().find(x=>x.id===r.material_id)||{}; return (!d||r.date===d)&&(!m||(mat.name||'').includes(m))&&(!h||(r.handler||'').includes(h)); })
    .map(r=>{ const mat=getMaterials().find(x=>x.id===r.material_id)||{}; return [r.id,mat.code,mat.name,mat.spec,mat.location,r.type,r.qty,r.date,r.handler,r.remark]; });
  const ws = XLSX.utils.aoa_to_sheet([['ID','物料编号','物料名称','规格型号','上架位置','类型','数量','日期','经办人','备注'], ...recs]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '入库记录');
  XLSX.writeFile(wb, '入库记录_'+today()+'.xlsx');
  toast('导出完成');
}

async function processOutbound(id){
  try {
    const { data: req, error: e1 } = await sb.from('outbound_requests').select('*').eq('id', id).maybeSingle();
    if (e1) throw new Error('查询申请失败：'+e1.message);
    if (!req){ toast('申请不存在', true); return; }
    // 预检库存
    const { data: mat } = await sb.from('materials').select('id,name,stock,unit').eq('id', req.material_id).maybeSingle();
    if (!mat) throw new Error('关联物料「'+req.material_name+'」已在系统中删除，无法出库');
    const need = Number(req.qty)||0;
    const have = Number(mat.stock)||0;
    if (need > have) {
      const msg = '【库存不足】'+mat.name+' 当前库存 '+have+' '+mat.unit+'，申请数量 '+need+' '+mat.unit+'，无法出库。\n请先通过「入库管理」补充库存后再处理。';
      toast(msg, true); return;
    }
    if(!confirm('确认出库？\n\n物料：'+mat.name+'\n数量：'+need+' '+mat.unit+'\n当前库存：'+have+' '+mat.unit+'\n\n出库后剩余：'+(have-need)+' '+mat.unit)) return;
    const { error: e2 } = await sb.rpc('do_outbound', {
      p_material_id: req.material_id,
      p_type: req.req_type || '领用出库',
      p_qty: req.qty,
      p_date: today(),
      p_receiver: req.applicant_name || req.applicant_email || authName(),
      p_purpose: req.reason || null,
      p_remark: ('来自出库申请 #'+id+'：'+(req.reason||'')) || null,
      p_operator: AUTH.real_name || authName(),
    });
    if (e2) throw new Error(e2.message || JSON.stringify(e2));
    const { error: e3 } = await sb.from('outbound_requests').update({ status:'handled', handled_at:new Date().toISOString(), handled_by: AUTH.real_name||'' }).eq('id', id);
    if (e3) throw new Error('更新状态失败：'+e3.message);
    toast('✅ 已出库 — '+mat.name+' 扣减 '+need+' '+mat.unit+'，剩余 '+(have-need)+' '+mat.unit);
    await loadRequests();
    await loadSnapshot();
  } catch(e){ toast('❌ 出库失败：'+e.message, true); }
}

// 在物料库中查找与申请物品同名/近似的物料
function matchStockItems(name){
  const norm = s => (s||'').toString().toLowerCase().replace(/[\s\-_/（）()【】\[\]]/g,'');
  const key = norm(name);
  if (key.length < 2) return [];
  return (getMaterials()||[]).filter(m=>{
    const mn = norm(m.name);
    if (!mn) return false;
    return mn === key || mn.includes(key) || key.includes(mn);
  });
}

// 实时提示：申请的物品在库里是否已有货
function onPurchaseNameInput(){
  const box = document.getElementById('pu_stockbox'); if(!box) return;

  const hits = matchStockItems(name);
  if (!hits.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='block';
  const enough = hits.filter(m => Number(m.stock||0) > Number(m.safety_stock||0));
  box.className = 'stock-box' + (enough.length ? ' ok' : '');
  box.innerHTML = '<b>📦 库房已有相近物料：</b><br>' + hits.map(m=>{
    const s = Number(m.stock||0), ss = Number(m.safety_stock||0);
    const tip = s>ss ? '<span style="color:#1a7f37">库存充足</span>'
              : (s<=0 ? '<span style="color:#e24b4a">缺货</span>' : '<span style="color:#c47f17">低于安全线</span>');
    return `· ${esc(m.name)}${m.spec?' ['+esc(m.spec)+']':''} — 现有 <b>${s}</b> ${esc(m.unit||'')}（安全线 ≥${ss}）｜ ${tip}`;
  }).join('<br>');
}

async function submitPurchase(){
  const name  = (document.getElementById('pu_name').value||'').trim();
  const qty   = parseFloat(document.getElementById('pu_qty').value);
  if(!name){ alert('请填写物品名称'); return; }
  if(!qty || qty<=0){ alert('请输入有效的采购数量'); return; }
  const model  = (document.getElementById('pu_model').value||'').trim()  || null;
  const unit   = (document.getElementById('pu_unit').value||'').trim()   || null;
  const date   = document.getElementById('pu_date').value || null;
  const priceV = parseFloat(document.getElementById('pu_price').value);
  const price  = isNaN(priceV) ? null : priceV;
  let url      = (document.getElementById('pu_url').value||'').trim() || null;
  if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  const reason = (document.getElementById('pu_reason').value||'').trim() || null;
  const remark = (document.getElementById('pu_remark').value||'').trim() || null;

  // 库存充足提醒：库里已有同名物料且库存高于安全库存线，先请教师确认
  const enough = matchStockItems(name).filter(m => Number(m.stock||0) > Number(m.safety_stock||0));
  if (enough.length){
    const detail = enough.map(m =>
      `　• ${m.name}${m.spec?'（'+m.spec+'）':''}：现有 ${Number(m.stock||0)} ${m.unit||''}（安全库存线 ≥${Number(m.safety_stock||0)}）`
    ).join('\n');
    const ok = confirm(
      '📦 库房已有该物料，且库存充足\n\n' + detail +
      '\n\n本次申请采购：' + name + ' × ' + qty + ' ' + (unit||'') +
      '\n\n如果只是课堂领用，请改用「出库申请」直接领取，无需采购。\n\n确认仍要提交这条采购申请吗？'
    );
    if (!ok) return;
  }

  try {
    const { error } = await sb.from('purchase_requests').insert({
      item_name:name, model, qty, unit, expect_date:date, est_price:price,
      buy_url:url, reason, remark
    });
    if (error) throw error;

    const content = '## 🛒 采购申请通知\n'
      + '> **申请人**：' + esc(AUTH.real_name || AUTH.email || '未知') + '\n'
      + '> **物品名称**：' + esc(name) + '\n'
      + '> **型号规格**：' + esc(model || '—') + '\n'
      + '> **数量**：' + qty + ' ' + esc(unit || '') + '\n'
      + '> **期望到货**：' + (date || '—') + '\n'
      + (price!=null ? '> **预估单价**：¥' + price + '（合计约 ¥' + (price*qty).toFixed(2) + '）\n' : '')
      + '> **用途**：' + esc(reason || '（未填写）') + '\n'
      + (enough.length ? '> **⚠️ 库房现有**：' + enough.map(m=>esc(m.name)+' '+Number(m.stock||0)+esc(m.unit||'')+'（安全线≥'+Number(m.safety_stock||0)+'）').join('；') + '\n' : '')
      + (remark ? '> **备注**：' + esc(remark) + '\n' : '')
      + (url ? '> **购买链接**：[点此查看商品](' + url + ')\n' : '')
      + '> **提交时间**：' + new Date().toLocaleString('zh-CN') + '\n'
      + '> [👉 进入系统查看采购计划](https://xiaojingbo-bot.github.io/yjjh-material/?view=purchase)';
    const pushed = await pushWecom(content);
    closeModal();
    toast(pushed ? '采购申请已提交，教务主任企业微信已收到通知' : '采购申请已提交（未配置企业微信通知）', !pushed);
    await loadPurchase();
  } catch(e){ toast('提交失败：'+e.message, true); }
}

function exportPurchase(){
  ensureXLSX();
  const fs = (document.getElementById('pr_filter')||{}).value || '';
  const q  = ((document.getElementById('pr_search')||{}).value || '').trim().toLowerCase();
  let rows = PR_CACHE.filter(r => (!fs || r.status===fs));
  if (q) rows = rows.filter(r => [r.item_name,r.model,r.applicant_name,r.reason].some(v=>(v||'').toLowerCase().includes(q)));
  if(!rows.length){ toast('当前筛选结果为空，无可导出内容', true); return; }

  let total = 0;
  const recs = rows.map((r,i)=>{
    const sub = (r.est_price!=null) ? Number(r.est_price)*Number(r.qty) : null;
    if (sub!=null) total += sub;
    return [ i+1, r.item_name||'', r.model||'', Number(r.qty)||0, r.unit||'',
             r.est_price!=null?Number(r.est_price):'', sub!=null?Number(sub.toFixed(2)):'',
             r.expect_date||'', r.buy_url||'', r.reason||'',
             r.applicant_name||r.applicant_email||'',
             (r.created_at||'').replace('T',' ').slice(0,16),
             (PR_STATUS[r.status]||{label:r.status}).label, r.remark||'' ];
  });
  recs.push(['','合计','','','','', Number(total.toFixed(2)), '','','','','','','']);

  const ws = XLSX.utils.aoa_to_sheet([
    ['序号','物品名称','型号/规格','数量','单位','预估单价(元)','预估小计(元)','期望到货','购买链接','用途说明','申请人','提交时间','状态','备注'],
    ...recs
  ]);
  ws['!cols'] = [{wch:5},{wch:20},{wch:18},{wch:7},{wch:6},{wch:12},{wch:13},{wch:12},{wch:34},{wch:22},{wch:10},{wch:17},{wch:9},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '采购计划');
  XLSX.writeFile(wb, '采购计划_' + today() + '.xlsx');
  toast('已导出 ' + rows.length + ' 条采购申请');
}

async function createAccount(){
  let email=document.getElementById('au_email').value.trim();
  const pwd=document.getElementById('au_pwd').value;
  const name=document.getElementById('au_name').value.trim();
  const role=document.getElementById('au_role').value;
  const msg=document.getElementById('au_msg');
  if(!email||!pwd){ msg.innerHTML='<span style="color:#e24b4a">请填写账号与初始密码</span>'; return; }
  // 若输入不含 @，自动补全为 @yjjh.edu
  if (!email.includes('@')) email = email + '@yjjh.edu';
  // 校验只允许英文、数字、下划线、点、连字符
  if (!/^[a-zA-Z0-9._+-]+@yjjh\.edu$/.test(email)){
    msg.innerHTML='<span style="color:#e24b4a">账号只能包含英文字母、数字、下划线、点、连字符</span>'; return;
  }
  msg.textContent='创建中…';

    const token = sess?.session?.access_token;
    if(!token){ msg.innerHTML='<span style="color:#e24b4a">登录态失效，请刷新页面重新登录</span>'; return; }
    const res = await fetch(EDGE_CREATE_TEACHER, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ action:'reset_password', email, password: pwd })
    });
    const out = await res.json();
    if(!res.ok){ msg.innerHTML='<span style="color:#e24b4a">失败：'+esc(out.error||res.status)+'</span>'; return; }
    msg.innerHTML='<span style="color:#2e7d32">✅ '+esc(out.msg||'密码已重置')+'<br>新密码：<b>'+esc(pwd)+'</b></span>';
  } catch(e){ msg.innerHTML='<span style="color:#e24b4a">失败：'+esc(e.message)+'</span>'; }
}

// ---------- XLSX 检查 ----------
function ensureXLSX(){ if (typeof XLSX==='undefined'){ toast('Excel 组件未加载，请检查网络后重试', true); throw new Error('XLSX not loaded'); } }

// ---------- 启动 ----------
(async function () {
  if (!(await checkLogin())) {
    document.getElementById('lg_pwd').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
    document.getElementById('lg_user').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('lg_pwd').focus(); });
  }
})();
document.getElementById('modalMask').addEventListener('click', e=>{ if(e.target.id==='modalMask') closeModal(); });
</script>
