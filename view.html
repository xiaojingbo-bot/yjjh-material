// ---------- Supabase 配置（部署前由我填入真实值，须与 index.html 一致）----------

function key(){ return new URL(location.href).searchParams.get('key') || ''; }
function statusOf(s, safe){ if (s<=0) return {c:'danger',t:'缺货'}; if (s<safe) return {c:'warn',t:'预警'}; return {c:'ok',t:'充足'}; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function load(manual){
  // 入口校验（登录）已在页面底部启动逻辑完成；此处直接拉取只读数据。
  // 真正的数据安全由 Supabase 行级权限（RLS）保障：登录用户仅可读、不可写。
  try {
    const m = await sb.from('materials').select('*').order('id', { ascending: true });
    if (m.error) throw m.error;
    PR_MATS = m.data || [];
    render({ materials: m.data || [] });
    document.getElementById('upd').textContent = '更新于 ' + new Date().toLocaleString('zh-CN');
    renderAuth();
  } catch(e){
    if (manual) alert(e.message);
    document.getElementById('cards').innerHTML = '<div class="err" style="grid-column:1/-1">'+esc(e.message)+'</div>';
  }
}
function render(d){
  const mats = d.materials || [];
  PR_MATS = mats;
  const warns = mats.filter(m => (m.stock||0) <= 0 || (m.stock||0) < (m.safety_stock||0)).length;
  const total = mats.reduce((s,m)=>s+(Number(m.stock)||0),0);
  const cons = mats.filter(m => m.is_consumable).length;
  document.getElementById('cards').innerHTML =
    `<div class="card"><div class="n">${mats.length}</div><div class="l">物料种类</div></div>`+
    `<div class="card"><div class="n">${total}</div><div class="l">库存总量</div></div>`+
    `<div class="card ${warns?'warn':''}"><div class="n">${warns}</div><div class="l">预警数</div></div>`+
    `<div class="card"><div class="n">${cons}</div><div class="l">耗材种类</div></div>`;
  renderMatsTable();
}
function renderMatsTable(){
  const tb = document.getElementById('mt'); if(!tb) return;
  const q = ((document.getElementById('mt_search')||{}).value||'').trim().toLowerCase();
  const all = PR_MATS || [];
  const rows = q ? all.filter(m => [m.code,m.name,m.spec,m.location].some(v=>(v||'').toLowerCase().includes(q))) : all;
  tb.innerHTML = rows.length ? rows.map(m=>{
    const stock = Number(m.stock)||0;
    const safe = Number(m.safety_stock)||0;
    const stockColor = stock<=0 ? '#e24b4a' : (stock<safe ? '#e08a00' : '#0c447c');
    return `<tr><td data-l="名称" class="c-name">${esc(m.name)}</td><td data-l="规格">${esc(m.spec)||'—'}</td><td data-l="位置">${esc(m.location)||'—'}</td><td data-l="库存" class="c-stock"><b style="color:${stockColor}">${stock}</b> <span style="color:#888;font-size:13px">${esc(m.unit||'')}</span></td></tr>`;
  }).join('') : '<tr><td colspan="4" class="empty">未找到匹配的物料</td></tr>';
  const cnt = document.getElementById('mt_count');
  if(cnt) cnt.textContent = q ? (rows.length+' / '+all.length+' 项') : (all.length+' 项');
}

    const g = document.getElementById('guard'); if (g) g.remove();

const PR_STATUS = {
  submitted: { label:'已申请', cls:'ok' },
  rejected:  { label:'已驳回', cls:'danger' },
  pending:   { label:'已申请', cls:'ok' },
  approved:  { label:'已申请', cls:'ok' },
  purchased: { label:'已申请', cls:'ok' }
};
const isPRRejected = r => r && r.status === 'rejected';
let PR_CACHE = [];
let PR_MATS = [];
let prLastTeacher = undefined;
const EDGE_WECOM_PROXY = 'https://mjucegnphdjpuxiyowrb.supabase.co/functions/v1/wecom-proxy';

function normName(s){ return (s||'').toString().toLowerCase().replace(/[\s\-_/（）()【】\[\]]/g,''); }
function matchStockItemsV(name){
  const key = normName(name);
  if (key.length < 2) return [];
  return (PR_MATS||[]).filter(m=>{
    const mn = normName(m.name);
    if (!mn) return false;
    return mn === key || mn.includes(key) || key.includes(mn);
  });
}

async function pushWecomV(content){
  try {
    const { data: { session } } = await sb.auth.getSession();
    const token = session?.access_token || '';
    const resp = await fetch(EDGE_WECOM_PROXY, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ content })
    });

    return data && data.ok;

async function submitPurchaseV(){
  const name = (document.getElementById('pu_name').value||'').trim();
  const qty  = parseFloat(document.getElementById('pu_qty').value);
  if(!name){ alert('请填写物品名称'); return; }
  if(!qty || qty<=0){ alert('请输入有效的采购数量'); return; }
  const model  = (document.getElementById('pu_model').value||'').trim() || null;
  const unit   = (document.getElementById('pu_unit').value||'').trim() || null;
  const date   = document.getElementById('pu_date').value || null;
  const priceV = parseFloat(document.getElementById('pu_price').value);
  const price  = isNaN(priceV) ? null : priceV;
  let url = (document.getElementById('pu_url').value||'').trim() || null;
  if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  const reason = (document.getElementById('pu_reason').value||'').trim() || null;

  const stockHits = matchStockItemsV(name).filter(m => Number(m.stock||0) > Number(m.safety_stock||0));
  if (stockHits.length){
    const detail = stockHits.map(m =>

    if (!ok) return;
  }

  try {
    const { error } = await sb.from('purchase_requests').insert({
      item_name:name, model, qty, unit, expect_date:date, est_price:price, buy_url:url, reason
    });
    if (error) throw error;

    const who = (TEACHER.user_metadata && TEACHER.user_metadata.real_name) || TEACHER.email || '未知';
    const content = '## 🛒 采购申请知会（无需审批）\n'
      + '> **申请人**：'+who+'\n'
      + '> **物品名称**：'+name+'\n'
      + '> **型号规格**：'+(model||'—')+'\n'
      + '> **数量**：'+qty+' '+(unit||'')+'\n'
      + '> **期望到货**：'+(date||'—')+'\n'
      + (price!=null ? '> **预估单价**：¥'+price+'（合计约 ¥'+(price*qty).toFixed(2)+'）\n' : '')
      + '> **用途**：'+(reason||'（未填写）')+'\n'
      + (stockHits.length ? '> **⚠️ 库房现有**：'+stockHits.map(m=>m.name+' '+Number(m.stock||0)+m.unit+'（安全线≥'+Number(m.safety_stock||0)+'）').join('；')+'\n' : '')
      + '> **提交时间**：'+new Date().toLocaleString('zh-CN')+'\n'
      + '> 该申请已直接进入采购计划，<font color="comment">如无需采购可在系统中驳回</font>\n'
      + '> [👉 进入系统查看采购计划](https://xiaojingbo-bot.github.io/yjjh-material/?view=purchase)';

// —— 归还入库判定（与后端 return_to_warehouse 匹配规则一致）——
function normKeyV(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,''); }
function matchWarehouseV(itemName, model){
  const mats = PR_MATS || [];
  const n = normKeyV(itemName), md = normKeyV(model);
  const same = mats.filter(m => normKeyV(m.name) === n);
  if (!same.length) return null;
  const exact = same.find(m => normKeyV(m.spec) === md);
  if (exact) return exact;
  return same.length === 1 ? same[0] : { _ambiguous: true, name: itemName };
}
function returnStateV(r){
  const m = matchWarehouseV(r.item_name, r.model);
  if (!m) return { ok:false, label:'仓库未建档', color:'#999', reason:'物料仓库中没有同名物料，无法归还（请联系教务主任建档）' };
  if (m._ambiguous) return { ok:false, label:'型号不明确', color:'#e8710a', reason:'仓库中有多条同名物料，请先核对规格型号' };
  if (m.is_consumable) return { ok:false, label:'耗材·不可归还', color:'#d93025', reason:'耗材用完即消耗，不支持归还入库' };
  return { ok:true, label:'非耗材·可归还', color:'#0b8043', reason:'', mat:m };
}

    + '<input type="hidden" id="tf_name_'+i+'" value="'+esc(r.item_name)+'">'
    + '<input type="hidden" id="tf_model_'+i+'" value="'+esc(r.model||'')+'">'
    + '<input type="hidden" id="tf_unit_'+i+'" value="'+esc(r.unit||'')+'">'
    + '<input type="hidden" id="tf_from_'+i+'" value="'+esc(r.holder_email)+'">'
    + '</div>').join('');
  showV('<h4>流转物料给其他老师</h4>'
    + '<div class="form-row"><label>接收老师</label><select id="tf_to" style="flex:1">'+opts+'</select></div>'
    + '<div style="margin:8px 0 4px;font-size:13px;color:#555">勾选的物料及流转数量：</div>'
    + rows
    + '<div id="tf_msg" style="font-size:13px;color:#888;min-height:16px;margin-top:6px"></div>'
    + '<div class="modal-actions"><button class="btn" onclick="closeV()">取消</button><button class="btn blue" onclick="submitTransferV('+items.length+')">确认流转</button></div>');
}
async function submitTransferV(n){
  const to = document.getElementById('tf_to').value;
  if(!to){ vtoast('请选择接收老师', true); return; }
  const items = [];
  for(let i=0;i<n;i++){
    const qty = parseInt(document.getElementById('tf_qty_'+i).value,10);
    const name = document.getElementById('tf_name_'+i).value;
    const model = document.getElementById('tf_model_'+i).value;
    const unit = document.getElementById('tf_unit_'+i).value;
    const from = document.getElementById('tf_from_'+i).value;
    if(!qty || qty<=0){ vtoast('「'+name+'」流转数量需大于 0', true); return; }
    items.push({ item_name:name, model, unit, qty, holder_email:from });
  }
  // 教务主任代转时，要求所选物料同属一位老师
  const fromEmail = isViewAdmin() ? items[0].holder_email : TEACHER.email;
  if (isViewAdmin() && items.some(r=>r.holder_email !== fromEmail)){
    vtoast('请只选择同一位老师的物料进行流转', true); return;
  }
  const msg = document.getElementById('tf_msg'); msg.textContent='流转中…';
  try {
    const { error } = await sb.rpc('do_transfer', { p_from_email: fromEmail, p_to_email: to, p_items: items });
    if (error) throw error;
    const tName = (TI_VIEW_TEACHERS.find(t=>t.email===to)||{}).real_name || to;
    const meName = (TEACHER.user_metadata && TEACHER.user_metadata.real_name) || TEACHER.email;
    const detail = items.map(r=>r.item_name+(r.model?'['+r.model+']':'')+' × '+r.qty+' '+(r.unit||'')).join('；');
    const content = '## 🔄 物料流转知会\n'
      + '> **转出**：' + meName + '\n'
      + '> **接收**：' + tName + '\n'
      + '> **物料**：' + detail + '\n'
      + '> **时间**：' + new Date().toLocaleString('zh-CN');
    await pushWecomV(content);
    closeV();
    vtoast('✅ 已流转给 ' + tName);
    await loadTransferV();
  } catch(e){ msg.innerHTML='<span style="color:#e24b4a">流转失败：'+esc(e.message)+'</span>'; }
}

// 📥 归还入库：把非耗材从教室物料库退回学校物料仓库
function openReturnModalV(oneId){
  let items;
  if (oneId){
    items = TI_CACHE.filter(r=>r.id===oneId);
  } else {
    const ids = new Set([...document.querySelectorAll('.ti_chk:checked')].map(c=>c.value));
    items = TI_CACHE.filter(r=>ids.has(r.id));
  }
  const okItems = [], badItems = [];
  items.forEach(r=>{ const s = returnStateV(r); (s.ok?okItems:badItems).push({ row:r, state:s }); });
  if (!okItems.length){
    vtoast(badItems.length ? ('无可归还物料：'+badItems[0].state.reason) : '请先勾选要归还的物料', true);
    return;
  }
  const fromEmail = isViewAdmin() ? okItems[0].row.holder_email : TEACHER.email;
  if (okItems.some(x=>x.row.holder_email !== fromEmail)){
    vtoast('请只选择同一位老师的物料进行归还', true); return;
  }
  const rows = okItems.map((x,i)=>{
    const r = x.row;
    return '<div class="form-row" style="align-items:center">'
      + '<label style="width:auto;min-width:170px">'+esc(r.item_name)+(r.model?' ['+esc(r.model)+']':'')+'</label>'
      + '<input type="number" min="1" max="'+r.qty+'" value="'+r.qty+'" id="rt_qty_'+i+'" style="width:90px"> <span style="color:#888">/ 共 '+r.qty+' '+esc(r.unit||'')+'</span>'
      + '<span style="color:#0b8043;font-size:12px;margin-left:6px">→ 仓库「'+esc(x.state.mat.name)+'」现有 '+x.state.mat.stock+' '+esc(x.state.mat.unit||'')+'</span>'
      + '<input type="hidden" id="rt_name_'+i+'" value="'+esc(r.item_name)+'">'
      + '<input type="hidden" id="rt_model_'+i+'" value="'+esc(r.model||'')+'">'
      + '<input type="hidden" id="rt_unit_'+i+'" value="'+esc(r.unit||'')+'">'
      + '</div>';
  }).join('');
  const skipped = badItems.length
    ? '<div style="margin-top:8px;padding:8px 10px;background:#fff4e5;border-left:3px solid #e8710a;font-size:12px;color:#8a4b00">以下 '
      + badItems.length + ' 项无法归还，已自动跳过：<br>'
      + badItems.map(x=>'· '+esc(x.row.item_name)+'（'+x.state.reason+'）').join('<br>') + '</div>'
    : '';
  showV('<h4>📥 归还入库 · 退回学校物料仓库</h4>'
    + '<p class="hint" style="margin-left:0">确认后物料将从<b>教室物料库扣减</b>，并在仓库生成一笔<b>「归还入库」</b>记录、库存自动增加。仅<b>非耗材</b>可归还。</p>'
    + '<div style="margin:8px 0 4px;font-size:13px;color:#555">归还物料及数量：</div>'
    + rows
    + '<div class="form-row"><label>归还说明</label><input id="rt_remark" placeholder="如：课程结束退回 / 设备闲置退库" value="课程结束退回"></div>'
    + skipped
    + '<input type="hidden" id="rt_from" value="'+esc(fromEmail)+'">'
    + '<div id="rt_msg" style="font-size:13px;color:#888;min-height:16px;margin-top:6px"></div>'
    + '<div class="modal-actions"><button class="btn" onclick="closeV()">取消</button><button class="btn green" onclick="submitReturnV('+okItems.length+')">确认归还入库</button></div>');
}
async function submitReturnV(n){
  const fromEmail = document.getElementById('rt_from').value;
  const remark = (document.getElementById('rt_remark').value||'').trim();
  const items = [];
  for (let i=0;i<n;i++){
    const qty = parseInt(document.getElementById('rt_qty_'+i).value,10);
    const name = document.getElementById('rt_name_'+i).value;
    const model = document.getElementById('rt_model_'+i).value;
    const unit = document.getElementById('rt_unit_'+i).value;
    if(!qty || qty<=0){ vtoast('「'+name+'」归还数量需大于 0', true); return; }
    items.push({ item_name:name, model, unit, qty });
  }
  const msg = document.getElementById('rt_msg'); msg.textContent='归还入库中…';
  try {
    const { data, error } = await sb.rpc('return_to_warehouse', {
      p_from_email: fromEmail, p_items: items, p_remark: remark || null
    });
    if (error) throw error;
    const res = data || {};
    const meName = (TEACHER.user_metadata && TEACHER.user_metadata.real_name) || TEACHER.email;
    const content = '## 📥 物料归还入库\n'
      + '> **归还人**：' + (res.handler || meName) + '\n'
      + '> **物料**：' + (res.detail || items.map(r=>r.item_name+' × '+r.qty).join('；')) + '\n'
      + '> **说明**：' + (remark || '教师归还') + '\n'
      + '> **时间**：' + new Date().toLocaleString('zh-CN');
    await pushWecomV(content);
    closeV();
    vtoast('✅ 已归还入库 — 共 '+(res.items||items.length)+' 种、'+(res.qty||0)+' 件');
    await load();
    await loadTransferV();
  } catch(e){ msg.innerHTML='<span style="color:#e24b4a">归还失败：'+esc(e.message||e)+'</span>'; }
}

// 调整 / 删除本人（或教务主任代管）教室物料
async function deleteItemV(id){
  const row = TI_CACHE.find(r=>r.id===id);
  if(!confirm('确认从教室物料库删除「'+(row?row.item_name:'该物料')+'」？')) return;
  try {
    const { error } = await sb.from('teacher_inventory').delete().eq('id', id);
    if (error) throw error;
    vtoast('已删除');
    await loadTransferV();
  } catch(e){ vtoast('删除失败：'+e.message, true); }
}
async function adjustItemV(id){
  const row = TI_CACHE.find(r=>r.id===id);
  const v = prompt('调整「'+(row?row.item_name:'')+'」的数量为：', row?row.qty:0);
  if(v===null) return;
  const qty = parseInt(v,10);
  if(isNaN(qty)||qty<0){ vtoast('数量无效', true); return; }
  try {
    const { error } = await sb.from('teacher_inventory').update({ qty, updated_at:new Date().toISOString() }).eq('id', id);
    if (error) throw error;
    vtoast('已更新数量');
    await loadTransferV();
  } catch(e){ vtoast('更新失败：'+e.message, true); }
}
</script>
